project:
  name: keds-cc3m-500k
  mode: author_style_approximation
model:
  backbone: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  weights_path: artifacts/clip
  embedding_dim: 768
  device: auto
  local_files_only: false
bkp:
  architecture: author_bkp_v1
  middle_dim: 512
  n_layer: 2
  cross_layers: 3
  heads: 8
  dim_head: 64
  dropout: 0.1
  input_normalization: l2
knowledge:
  database_path: artifacts/source/keds_knowledge_db.pt
  index_dir: artifacts/knowledge
  expected_count: 500000
  top_k: 16
  retrieval: independent
checkpoints:
  phi_m: artifacts/checkpoints/phi_m_best_author_modules.pt
  phi_a: artifacts/checkpoints/phi_a_best_author_modules.pt
inference:
  alpha: 0.5
  prompt_template: "a photo of * , {modification}"
  max_text_length: 500
gallery:
  root: artifacts/gallery
api:
  max_upload_mb: 10
  max_image_pixels: 25000000
  max_top_k: 100
  load_on_startup: true
rag:
  profile: E0
  query_aware: {enabled: false}
  knowledge_reranking: {enabled: false}
  adaptive_k: {enabled: false}
  adaptive_fusion: {enabled: false}
  gallery_reranking: {enabled: false}
  cache: {enabled: false}

